<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Земляне — Виртуальная биологическая академия</title>
    <style>
        :root {
            --bg-color: #fcfbf9;
            --mint-primary: #769e88;
            --pink-accent: #b06873;
            --text-dark: #3a4740;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-dark);
            overflow-x: hidden;
        }

        /* Шапка сайта: меню выровнено по центру */
        .site-header-custom {
            padding: 20px 40px;
            position: relative;
            z-index: 10;
        }

        .header-flex {
            display: flex;
            justify-content: center; /* Центрируем меню в шапке */
        }

        .main-nav-custom {
            display: flex;
            gap: 25px;
            align-items: center;
        }

        .nav-btn {
            text-decoration: none;
            color: #8c9892;
            font-size: 16px;
            font-weight: 500;
            text-transform: lowercase;
            transition: color 0.3s;
        }

        .nav-btn.active {
            background-color: var(--mint-primary);
            color: white;
            padding: 8px 18px;
            border-radius: 20px;
            text-transform: none;
        }

        .nav-btn.accent-lessons {
            color: var(--pink-accent);
            font-weight: bold;
            text-transform: uppercase;
            font-size: 17px;
        }

        .nav-btn:hover {
            color: var(--text-dark);
        }

        /* Главный экран: фон .webp растянут на всю страницу */
        .hero-bg-section {
            width: 100%;
            min-height: calc(100vh - 80px);
            background-image: url('fon.webp');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center; /* Выравниваем содержимое строго по центру экрана */
        }

        /* Контейнер текста по центру экрана */
        .hero-content-box {
            text-align: center; /* Текст внутри выравнивается по центру */
            max-width: 700px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center; /* Центрируем элементы внутри блока */
        }

        .main-title {
            font-size: 82px;
            font-family: serif;
            color: var(--mint-primary);
            font-weight: normal;
            line-height: 1;
            margin-bottom: 10px;
        }

        .main-subtitle {
            font-size: 19px;
            color: #555;
            margin-bottom: 15px;
        }

        .subtitle-line {
            width: 110px;
            height: 2px;
            background-color: var(--pink-accent);
            margin-bottom: 25px;
        }

        .hero-icons {
            display: flex;
            gap: 25px;
            font-size: 24px;
            margin-bottom: 30px;
            justify-content: center;
        }

        .action-card {
            display: flex;
            align-items: center;
            gap: 30px;
            justify-content: center;
        }

        .animated-logo-container {
            width: 90px;
            height: 90px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .dancing-logo {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .btn-club {
            background-color: var(--pink-accent);
            color: white;
            padding: 15px 35px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            font-size: 15px;
            letter-spacing: 1px;
            box-shadow: 0 4px 10px rgba(176, 104, 115, 0.3);
            transition: transform 0.2s;
            display: inline-block;
        }

        .btn-club:hover {
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <!-- Шапка сайта -->
    <header class="site-header-custom">
        <div class="container header-flex">
            <nav class="main-nav-custom">
                <a href="index.html" class="nav-btn active">Главная</a>
                <a href="about.html" class="nav-btn">о нас</a>
                <a href="lessons/index.html" class="nav-btn accent-lessons">УРОКИ</a>
                <a href="news/index.html" class="nav-btn">новости</a>
                <a href="projects/index.html" class="nav-btn">достижения</a>
            </nav>
        </div>
    </header>

    <!-- Главный экран -->
    <section class="hero-bg-section">
        <div class="hero-content-box">
            <h1 class="main-title">Земляне</h1>
            <p class="main-subtitle">Наша суперсила — в знаниях и их применении</p>
            <div class="subtitle-line"></div>

            <div class="hero-icons">
                <span>🌿</span>
                <span>🔬</span>
                <span>🔍</span>
                <span>🌍</span>
                <span>🌱</span>
            </div>

            <div class="action-card">
                <div class="animated-logo-container">
                    <video src="logoanime.mp4" autoplay loop muted playsinline class="dancing-logo"></video>
                </div>
                <a href="earth-club/index.html" class="btn-club">ВСТУПИТЬ В КЛУБ</a>
            </div>
        </div>
    </section>

</body>
</html>
